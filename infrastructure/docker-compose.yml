# =============================================================================
# Workflow Platform - Local Development Docker Compose
# =============================================================================
#
# Usage:
#   docker compose up -d
#   docker compose down -v   # destroys all volumes
#
# .env.example — copy to .env and customise before running:
# -----------------------------------------------------------------------------
# POSTGRES_PASSWORD=postgres
# POSTGRES_USER=postgres
# KEYCLOAK_ADMIN=admin
# KEYCLOAK_ADMIN_PASSWORD=admin
# KC_DB_PASSWORD=keycloak
# KAFKA_NODE_ID=1
# REDIS_PASSWORD=          # leave blank to disable auth
# MINIO_ROOT_USER=minioadmin
# MINIO_ROOT_PASSWORD=minioadmin
# MINIO_BUCKET_NAME=workflow-attachments
# MAILHOG_SMTP_PORT=1025
# MAILHOG_UI_PORT=8025
# KAFKA_UI_PORT=8090
# KEYCLOAK_PORT=8080
# POSTGRES_PORT=5432
# REDIS_PORT=6379
# MINIO_API_PORT=9000
# MINIO_CONSOLE_PORT=9001
# -----------------------------------------------------------------------------

name: workflow-platform

networks:
  workflow-net:
    driver: bridge
    name: workflow-net

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # Hosts all service databases in a single instance for local dev convenience.
  # In production each service uses its own dedicated cluster.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: workflow-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-compose.init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - workflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Keycloak 24 — Identity & Access Management
  # Runs in dev mode (embedded H2 disabled; uses postgres instead).
  # Realm import: mount realm JSON files into /opt/keycloak/data/import/
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: workflow-keycloak
    restart: unless-stopped
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workflow-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready -o /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Apache Kafka 3.7 — KRaft mode (no ZooKeeper)
  # Single-node broker + controller combined for local development.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: workflow-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - workflow-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Kafka UI — Web UI for browsing topics, consumer groups, and messages
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: workflow-kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "false"
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - workflow-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health -o /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis 7 — Cache, session store, and distributed locks
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: workflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - workflow-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage for workflow attachments
  # Console UI: http://localhost:9001  (minioadmin / minioadmin)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: workflow-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SITE_NAME: workflow-platform-local
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - workflow-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # MinIO Init — One-shot container that creates required buckets on startup.
  # Runs mc (MinIO Client) to configure the alias and apply bucket policy.
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: workflow-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - workflow-net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-workflow-attachments}
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for MinIO to be ready...';
        until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
          echo 'MinIO not ready yet, retrying in 3s...';
          sleep 3;
        done;
        echo 'MinIO alias configured.';

        if mc ls local/$${MINIO_BUCKET_NAME} > /dev/null 2>&1; then
          echo \"Bucket '$${MINIO_BUCKET_NAME}' already exists, skipping creation.\";
        else
          mc mb local/$${MINIO_BUCKET_NAME};
          echo \"Bucket '$${MINIO_BUCKET_NAME}' created.\";
        fi;

        mc anonymous set download local/$${MINIO_BUCKET_NAME};
        echo 'Bucket policy set to download (read-write for authenticated users).';

        echo 'MinIO initialisation complete.';
      "

  # ---------------------------------------------------------------------------
  # Mailhog — SMTP catch-all for local email testing
  # SMTP: localhost:1025   Web UI: http://localhost:8025
  # ---------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: workflow-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - workflow-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
