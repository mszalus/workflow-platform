---
# =============================================================================
# Namespace: gateway
# Hosts API gateway and ingress components:
#   Kong Gateway (Kong Operator / KIC), rate-limit plugins,
#   external-dns, cert-manager webhook
# Managed by ArgoCD — do not apply manually in production.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  labels:
    app.kubernetes.io/managed-by: argocd
    environment: production
    app.kubernetes.io/part-of: workflow-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
    description: "API Gateway layer — Kong Gateway, Ingress, rate limiting, TLS termination"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: gateway-limit-range
  namespace: gateway
  labels:
    app.kubernetes.io/managed-by: argocd
    environment: production
spec:
  limits:
    # Gateway pods are typically CPU-bound under high throughput
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "4"
        memory: "4Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
    - type: PersistentVolumeClaim
      max:
        storage: "20Gi"
      min:
        storage: "1Gi"
    - type: Pod
      max:
        cpu: "8"
        memory: "8Gi"
