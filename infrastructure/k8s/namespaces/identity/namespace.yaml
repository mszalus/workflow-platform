---
# =============================================================================
# Namespace: identity
# Hosts identity and access management components:
#   Keycloak (operator-managed), Keycloak Operator
# Managed by ArgoCD — do not apply manually in production.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: identity
  labels:
    app.kubernetes.io/managed-by: argocd
    environment: production
    app.kubernetes.io/part-of: workflow-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
    description: "Identity & Access Management — Keycloak IAM, OIDC/SAML federation"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: identity-limit-range
  namespace: identity
  labels:
    app.kubernetes.io/managed-by: argocd
    environment: production
spec:
  limits:
    # Keycloak is memory-intensive at startup; allow generous defaults
    - type: Container
      default:
        cpu: "1"
        memory: "1Gi"
      defaultRequest:
        cpu: "250m"
        memory: "512Mi"
      max:
        cpu: "4"
        memory: "8Gi"
      min:
        cpu: "100m"
        memory: "256Mi"
    - type: PersistentVolumeClaim
      max:
        storage: "50Gi"
      min:
        storage: "1Gi"
    - type: Pod
      max:
        cpu: "8"
        memory: "16Gi"
