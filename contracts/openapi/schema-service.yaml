openapi: 3.1.0
info:
  title: Schema Service API
  version: 1.0.0
  description: >
    Manages versioned custom-field schemas that are bound to process definitions.
    Each schema defines the fields that must be collected at runtime, together with
    their validation rules, visibility conditions, and role-based editability.
    Schemas are immutable once published; updates create a new version and
    automatically mark the previous version inactive.
  contact:
    name: Platform Engineering
  license:
    name: Proprietary

servers:
  - url: http://schema-service:8080
    description: Internal Kubernetes service endpoint

security:
  - bearerAuth: []

tags:
  - name: schemas
    description: Field schema lifecycle management
  - name: field-values
    description: Runtime field value persistence

paths:

  # ─── Schemas ────────────────────────────────────────────────────────────────

  /api/v1/schemas:
    post:
      tags: [schemas]
      operationId: createSchema
      summary: Create a new field schema for a process definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchemaRequest'
      responses:
        '201':
          description: Schema created (version 1 for this processDefKey)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldSchemaDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An active schema already exists for this processDefKey; use PUT to create a new version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    get:
      tags: [schemas]
      operationId: listSchemas
      summary: List field schemas for the current tenant
      parameters:
        - name: processDefKey
          in: query
          required: false
          schema:
            type: string
          description: Filter schemas by process definition key
        - name: active
          in: query
          required: false
          schema:
            type: boolean
          description: When true returns only currently active schemas
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paged list of schemas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/FieldSchemaDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/schemas/{schemaId}:
    get:
      tags: [schemas]
      operationId: getSchema
      summary: Get a schema by ID
      parameters:
        - $ref: '#/components/parameters/SchemaIdPath'
      responses:
        '200':
          description: Schema detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldSchemaDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [schemas]
      operationId: updateSchema
      summary: Update a schema (creates a new version, deactivates the current one)
      description: >
        This operation is non-destructive. The existing schema record is marked
        `isActive: false` and a new schema record with an incremented version is
        created and returned. Field values recorded against the old schema version
        are preserved and remain queryable.
      parameters:
        - $ref: '#/components/parameters/SchemaIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSchemaRequest'
      responses:
        '201':
          description: New schema version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldSchemaDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Schema is already inactive; cannot create a new version from it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [schemas]
      operationId: deleteSchema
      summary: Soft-delete (deactivate) a schema
      description: >
        Marks the schema as inactive. Schemas with associated field values
        cannot be hard-deleted and will be deactivated instead regardless of
        the `permanent` flag.
      parameters:
        - $ref: '#/components/parameters/SchemaIdPath'
        - name: permanent
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true and no field values exist, physically removes the record
      responses:
        '204':
          description: Schema deactivated or deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Schema has associated field values and cannot be permanently deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/schemas/active/{processDefKey}:
    get:
      tags: [schemas]
      operationId: getActiveSchemaByProcess
      summary: Get the currently active schema for a process definition key
      description: >
        Convenience endpoint used by the task renderer to retrieve the active
        schema without knowing the schema ID. Returns 404 when no active schema
        is configured for the given process definition key.
      parameters:
        - name: processDefKey
          in: path
          required: true
          schema:
            type: string
          description: Process definition key
          example: "order-fulfilment"
      responses:
        '200':
          description: Active schema for the process definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldSchemaDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No active schema found for this process definition key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Field Values ────────────────────────────────────────────────────────────

  /api/v1/field-values:
    post:
      tags: [field-values]
      operationId: saveFieldValues
      summary: Save a batch of field values for a process instance or task
      description: >
        Idempotent upsert operation. If a value already exists for the combination
        of (processInstanceId, taskId, fieldKey) within the tenant, it will be
        overwritten. Each individual value in the batch is validated against the
        active schema for the associated process definition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldValueBatchDto'
      responses:
        '200':
          description: All field values saved; returns the full updated batch
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FieldValueDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    get:
      tags: [field-values]
      operationId: listFieldValues
      summary: Query field values for a process instance or task
      parameters:
        - name: processInstanceId
          in: query
          required: false
          schema:
            type: string
          description: Filter by process instance ID
        - name: taskId
          in: query
          required: false
          schema:
            type: string
          description: Filter by task ID
      responses:
        '200':
          description: List of field values matching the filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FieldValueDto'
        '400':
          description: At least one filter parameter (processInstanceId or taskId) is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/field-values/{valueId}:
    put:
      tags: [field-values]
      operationId: updateFieldValue
      summary: Update a single field value by ID
      parameters:
        - name: valueId
          in: path
          required: true
          schema:
            type: string
          description: Field value record ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFieldValueRequest'
      responses:
        '200':
          description: Updated field value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldValueDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT issued by Keycloak. Must include `tenant_id` and standard `sub`
        claims.

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Zero-based page index

    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
      description: Number of items per page

    SchemaIdPath:
      name: schemaId
      in: path
      required: true
      schema:
        type: string
      description: Field schema UUID

  responses:
    BadRequest:
      description: Request body or query parameters failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Authenticated user lacks permission for this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Requested resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnprocessableEntity:
      description: Request is syntactically valid but semantically incorrect
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # ── Pagination ────────────────────────────────────────────────────────────
    PagedResponse:
      type: object
      required: [content, totalElements, totalPages, page, size]
      properties:
        content:
          type: array
          items: {}
        totalElements:
          type: integer
          format: int64
          example: 12
        totalPages:
          type: integer
          example: 1
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20

    # ── Field Schema ──────────────────────────────────────────────────────────
    FieldSchemaDto:
      type: object
      required: [id, tenantId, processDefKey, version, isActive, createdAt, fields]
      properties:
        id:
          type: string
          format: uuid
          example: "b2e4c6a0-1234-4f5b-8c9d-0e1f2a3b4c5d"
        tenantId:
          type: string
          example: "acme-corp"
        processDefKey:
          type: string
          description: Bound process definition key
          example: "order-fulfilment"
        version:
          type: integer
          description: Monotonically increasing version number within a processDefKey
          minimum: 1
          example: 2
        isActive:
          type: boolean
          description: Only one version per processDefKey can be active at a time
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2025-10-15T09:00:00Z"
        fields:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldDefinitionDto'

    # ── Field Definition ──────────────────────────────────────────────────────
    FieldDefinitionDto:
      type: object
      required: [id, fieldKey, label, fieldType, required, displayOrder]
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-0000-4000-8000-aabbccddeeff"
        fieldKey:
          type: string
          description: Stable machine-readable identifier; used as the key in field value records
          example: "shippingAddress"
        label:
          type: string
          description: Human-readable label shown in the UI
          example: "Shipping Address"
        fieldType:
          type: string
          enum: [TEXT, NUMBER, DATE, BOOLEAN, ENUM, FILE_REF, USER_REF]
          example: "TEXT"
        required:
          type: boolean
          example: true
        validationRules:
          type: object
          description: >
            Flexible validation rule bag. Recognised keys depend on fieldType:
            TEXT: minLength, maxLength, pattern (regex);
            NUMBER: min, max, step;
            DATE: minDate, maxDate;
            FILE_REF: maxFileSizeBytes, allowedMimeTypes (array).
          additionalProperties: true
          example:
            maxLength: 255
            pattern: "^[A-Za-z0-9 ,.-]+$"
        options:
          type: array
          description: Allowed values for ENUM type fields
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
                example: "EXPRESS"
              label:
                type: string
                example: "Express Shipping"
        visibleOnTasks:
          type: array
          description: >
            List of BPMN task definition keys where this field should be rendered.
            Empty list means visible on all tasks.
          items:
            type: string
          example: ["reviewOrderTask", "dispatchTask"]
        editableByRoles:
          type: array
          description: Keycloak role names that may edit this field. Empty means all roles.
          items:
            type: string
          example: ["order-manager", "admin"]
        displayOrder:
          type: integer
          description: Ascending sort order within the form
          minimum: 0
          example: 1

    # ── Field Value ───────────────────────────────────────────────────────────
    FieldValueDto:
      type: object
      required: [id, tenantId, processInstanceId, fieldKey, fieldType]
      properties:
        id:
          type: string
          format: uuid
          example: "fv-00112233-4455-6677-8899-aabbccddeeff"
        tenantId:
          type: string
          example: "acme-corp"
        processInstanceId:
          type: string
          example: "pi-99a2b"
        taskId:
          type: string
          nullable: true
          description: Set when the value was submitted in the context of a specific task
          example: "task-aa1b2"
        fieldKey:
          type: string
          example: "shippingAddress"
        fieldType:
          type: string
          enum: [TEXT, NUMBER, DATE, BOOLEAN, ENUM, FILE_REF, USER_REF]
          example: "TEXT"
        value:
          description: >
            The stored value. Type corresponds to fieldType:
            TEXT/ENUM/USER_REF -> string;
            NUMBER -> number;
            DATE -> string (ISO-8601 date or date-time);
            BOOLEAN -> boolean;
            FILE_REF -> string (attachment ID).
          oneOf:
            - type: string
            - type: number
            - type: boolean
          nullable: true
          example: "123 Main St, Springfield"

    # ── Field Value Batch ─────────────────────────────────────────────────────
    FieldValueBatchDto:
      type: object
      required: [processInstanceId, values]
      properties:
        processInstanceId:
          type: string
          example: "pi-99a2b"
        taskId:
          type: string
          nullable: true
          description: Set when the batch originates from a specific task form submission
          example: "task-aa1b2"
        values:
          type: array
          minItems: 1
          items:
            type: object
            required: [fieldKey, value]
            properties:
              fieldKey:
                type: string
                example: "shippingAddress"
              value:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
                nullable: true
                example: "123 Main St, Springfield"

    # ── Request bodies ────────────────────────────────────────────────────────
    CreateSchemaRequest:
      type: object
      required: [processDefKey, fields]
      properties:
        processDefKey:
          type: string
          example: "order-fulfilment"
        fields:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldDefinitionInput'

    UpdateSchemaRequest:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldDefinitionInput'

    FieldDefinitionInput:
      type: object
      required: [fieldKey, label, fieldType, required, displayOrder]
      description: Input shape for creating or updating a field definition (no server-assigned id)
      properties:
        fieldKey:
          type: string
          example: "shippingAddress"
        label:
          type: string
          example: "Shipping Address"
        fieldType:
          type: string
          enum: [TEXT, NUMBER, DATE, BOOLEAN, ENUM, FILE_REF, USER_REF]
          example: "TEXT"
        required:
          type: boolean
          example: true
        validationRules:
          type: object
          additionalProperties: true
          example:
            maxLength: 255
        options:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
              label:
                type: string
        visibleOnTasks:
          type: array
          items:
            type: string
        editableByRoles:
          type: array
          items:
            type: string
        displayOrder:
          type: integer
          minimum: 0
          example: 1

    UpdateFieldValueRequest:
      type: object
      required: [value]
      properties:
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
          nullable: true
          description: New value; must conform to the field's validation rules

    # ── Error ─────────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2025-11-01T15:05:00Z"
        status:
          type: integer
          example: 404
        error:
          type: string
          example: "Not Found"
        message:
          type: string
          example: "Schema b2e4c6a0-1234-4f5b-8c9d-0e1f2a3b4c5d not found"
        path:
          type: string
          example: "/api/v1/schemas/b2e4c6a0-1234-4f5b-8c9d-0e1f2a3b4c5d"
