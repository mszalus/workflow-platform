openapi: 3.1.0
info:
  title: Audit Service API
  version: 1.0.0
  description: >
    Provides read-only access to audit events collected from all platform
    services. Events are ingested via Kafka and stored in PostgreSQL. This
    API exposes query endpoints for compliance, debugging, and operational
    visibility. All endpoints require AUDIT_VIEWER or WORKFLOW_ADMIN role.
  contact:
    name: Platform Engineering
  license:
    name: Proprietary

servers:
  - url: http://audit-service:8080
    description: Internal Kubernetes service endpoint

security:
  - bearerAuth: []

tags:
  - name: audit-events
    description: Audit event query endpoints

paths:

  # ─── Audit Events ──────────────────────────────────────────────────────────

  /api/v1/audit-events:
    get:
      tags: [audit-events]
      operationId: listAuditEvents
      summary: Query audit events with optional filters
      description: >
        Returns a paged list of audit events for the caller's tenant. Requires
        AUDIT_VIEWER or WORKFLOW_ADMIN role. Results are ordered by occurredAt
        descending.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Zero-based page index
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Number of items per page (capped at 200)
        - name: eventType
          in: query
          required: false
          schema:
            type: string
          description: Filter by event type
          example: "TASK_COMPLETED"
        - name: actorId
          in: query
          required: false
          schema:
            type: string
          description: Filter by the Keycloak user UUID of the actor
          example: "user-uuid-5678"
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Return events that occurred at or after this ISO-8601 timestamp
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Return events that occurred at or before this ISO-8601 timestamp
      responses:
        '200':
          description: Paged list of audit events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditEventDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/audit-events/{id}:
    get:
      tags: [audit-events]
      operationId: getAuditEvent
      summary: Get a single audit event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Audit event UUID
      responses:
        '200':
          description: Audit event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT issued by Keycloak. Must include `tenant_id` and `sub` claims.
        Requires AUDIT_VIEWER or WORKFLOW_ADMIN role.

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Caller lacks AUDIT_VIEWER or WORKFLOW_ADMIN role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Audit event not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # ── Pagination ────────────────────────────────────────────────────────────
    PagedResponse:
      type: object
      required: [content, totalElements, totalPages, page, size]
      properties:
        content:
          type: array
          items: {}
        totalElements:
          type: integer
          format: int64
          example: 142
        totalPages:
          type: integer
          example: 3
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 50

    # ── Audit Event ──────────────────────────────────────────────────────────
    AuditEventDto:
      type: object
      required: [id, eventId, eventType, tenantId, occurredAt, receivedAt, topic]
      properties:
        id:
          type: string
          format: uuid
          description: Internal database UUID
          example: "ae-uuid-0001"
        eventId:
          type: string
          description: Original event UUID from the producing service
          example: "evt-uuid-1234"
        eventType:
          type: string
          description: Event type discriminator
          example: "TASK_COMPLETED"
        tenantId:
          type: string
          description: Tenant that owns the resource
          example: "acme-corp"
        actorId:
          type: string
          nullable: true
          description: Keycloak user UUID of the actor; null for system events
          example: "user-uuid-5678"
        occurredAt:
          type: string
          format: date-time
          description: When the event originally occurred
          example: "2025-11-01T15:05:00Z"
        receivedAt:
          type: string
          format: date-time
          description: When the audit service received and persisted the event
          example: "2025-11-01T15:05:01Z"
        topic:
          type: string
          description: Kafka topic the event was consumed from
          example: "workflow.events"
        payload:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            Deserialized event payload. Structure varies by eventType.
          example:
            processInstanceId: "pi-99a2b"
            taskId: "task-aa1b2"

    # ── Error ─────────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2025-11-01T15:05:00Z"
        status:
          type: integer
          example: 404
        error:
          type: string
          example: "Not Found"
        message:
          type: string
          example: "Audit event ae-uuid-9999 not found"
        path:
          type: string
          example: "/api/v1/audit-events/ae-uuid-9999"
