org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC

# Version catalog
springBootVersion=3.5.16
springCloudVersion=2025.0.3
flowableVersion=7.1.0
springDocVersion=2.8.17
mapstructVersion=1.6.2
lombokVersion=1.18.38
testcontainersVersion=1.20.3
keycloakVersion=25.0.6

# Overrides the Tomcat managed by Spring Boot 3.5.16 (10.1.55, CRITICAL CVE-2026-65182, -65905, -68525). Drop once Boot manages 10.1.58 or later.
tomcat.version=10.1.60
# Overrides for HIGH CVEs in Boot-managed libraries (#63). Drop each once Boot manages the fixed version or later.
# amqp-client 5.25.0: CVE-2026-63337, -69219, -69220, -75516 (fixed by 5.34.0)
rabbit-amqp-client.version=5.36.0
# amqp-client 5.36.0 requires Netty 4.2 (Boot manages 4.1.135, CRITICAL CVE-2026-75595); Netty reaches the services only through amqp-client
netty.version=4.2.18.Final
# postgresql 42.7.11: CVE-2026-54291 (fixed in 42.7.12)
postgresql.version=42.7.13
# httpcore5 5.3.6: CVE-2026-54399, -54428 (fixed in 5.4.3). httpclient5 moves to 5.6.x, the line built against httpcore5 5.4
httpcore5.version=5.4.4
httpclient5.version=5.6.4
# jackson-databind 2.21.4: CVE-2026-68497 (fixed in 2.21.6)
jackson-bom.version=2.21.7
