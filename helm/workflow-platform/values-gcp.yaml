## GCP production/dev values — apply with:
##   helm upgrade --install wfp helm/workflow-platform/ \
##     -f helm/workflow-platform/values-gcp.yaml \
##     --set externalSecrets.gcpProjectId=<project-id> \
##     --set externalSecrets.clusterName=<cluster-name> \
##     --set externalSecrets.clusterLocation=europe-west1 \
##     --set "otel-collector.gcpProjectId=<project-id>"

postgresql:
  enabled: false   # Using Cloud SQL via private IP

keycloak:
  enabled: false   # Deployed separately or as managed identity provider

# ---------------------------------------------------------------------------
# External Secrets Operator — ClusterSecretStore → GCP Secret Manager
# ESO must be installed before deploying this chart:
#   helm install external-secrets external-secrets/external-secrets \
#     -n external-secrets --create-namespace
# ---------------------------------------------------------------------------
externalSecrets:
  enabled: true
  gcpProjectId: "REPLACE_WITH_GCP_PROJECT_ID"
  clusterLocation: "europe-west1"
  clusterName: "REPLACE_WITH_CLUSTER_NAME"
  environment: "dev"   # or "prod"

# ---------------------------------------------------------------------------
# OTEL Collector — exports traces to GCP Cloud Trace
# ---------------------------------------------------------------------------
otel-collector:
  enabled: true
  gcpProjectId: "REPLACE_WITH_GCP_PROJECT_ID"
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# ---------------------------------------------------------------------------
# Backend services — Cloud SQL connection + observability
# DB password comes from the ExternalSecret-created K8s secret.
# ---------------------------------------------------------------------------
workflow-service:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  serviceAccount:
    create: true
    annotations:
      iam.gke.io/gcp-service-account: "REPLACE_WITH_WORKLOAD_SA_EMAIL"
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  externalSecrets:
    enabled: true
    environment: "dev"
  env:
    # Cloud SQL private IP — no proxy needed from GKE with VPC peering
    SPRING_DATASOURCE_URL: "jdbc:postgresql://REPLACE_WITH_CLOUDSQL_PRIVATE_IP:5432/wfp?currentSchema=workflow"
    SPRING_DATASOURCE_USERNAME: "wfp"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"
    GOOGLE_CLOUD_PROJECT: "REPLACE_WITH_GCP_PROJECT_ID"
  secretEnv:
    - name: SPRING_DATASOURCE_PASSWORD
      secretName: workflow-service-secrets
      secretKey: db-password

admin-portal:
  replicaCount: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

user-portal:
  replicaCount: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
