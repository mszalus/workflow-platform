apiVersion: v2
name: workflow-platform
description: WFP Umbrella Helm Chart
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: gateway
    version: 0.1.0
    repository: file://../charts/gateway
  - name: workflow-service
    version: 0.1.0
    repository: file://../charts/workflow-service
  - name: admin-portal
    version: 0.1.0
    repository: file://../charts/admin-portal
  - name: user-portal
    version: 0.1.0
    repository: file://../charts/user-portal
  - name: otel-collector
    version: 0.1.0
    repository: file://../charts/otel-collector
    condition: otel-collector.enabled
  - name: postgresql
    version: 16.2.1
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: keycloak
    version: 22.2.5
    repository: https://charts.bitnami.com/bitnami
    condition: keycloak.enabled
