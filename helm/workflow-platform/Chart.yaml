apiVersion: v2
name: workflow-platform
description: WFP Umbrella Helm Chart
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: app
    version: 0.1.0
    repository: file://../charts/app
  - name: web
    version: 0.1.0
    repository: file://../charts/web
  - name: otel-collector
    version: 0.1.0
    repository: file://../charts/otel-collector
    condition: otel-collector.enabled
  - name: postgresql
    version: 16.2.1
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: keycloak
    version: 22.2.5
    repository: https://charts.bitnami.com/bitnami
    condition: keycloak.enabled
