{{- if .Values.externalSecrets.enabled }}
# ClusterSecretStore — connects External Secrets Operator to GCP Secret Manager.
# Install ESO first:
#   helm install external-secrets external-secrets/external-secrets \
#     -n external-secrets --create-namespace
#
# Workload Identity must be configured on the GKE cluster and the workload SA
# must have roles/secretmanager.secretAccessor (set by Terraform iam module).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.externalSecrets.gcpProjectId | quote }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.externalSecrets.clusterLocation | quote }}
          clusterName: {{ .Values.externalSecrets.clusterName | quote }}
          serviceAccountRef:
            name: wfp-workload
            namespace: {{ .Release.Namespace }}
{{- end }}
