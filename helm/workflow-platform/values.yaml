postgresql:
  enabled: true
  auth:
    username: wfp
    password: wfp_secret
    database: wfp

rabbitmq:
  enabled: true
  auth:
    username: wfp
    password: wfp_secret

keycloak:
  enabled: true
  auth:
    adminUser: admin
    adminPassword: admin

# External Secrets Operator — disabled locally, enabled on GCP via values-gcp.yaml
externalSecrets:
  enabled: false
  gcpProjectId: ""
  clusterLocation: ""
  clusterName: ""
  environment: "dev"   # used to construct secret names: wfp-<env>-<secret>
