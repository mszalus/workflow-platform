{{- if .Values.externalSecrets.enabled }}
# Syncs the shared wfp-<env>-db-password secret from GCP Secret Manager.
# ESO will create a K8s Secret named "{{ include "chart.fullname" . }}-secrets"
# which is then referenced in the Deployment via env.valueFrom.secretKeyRef.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "chart.fullname" . }}-secrets
  labels:
    app: {{ include "chart.fullname" . }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: {{ include "chart.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: wfp-{{ .Values.externalSecrets.environment }}-db-password
    - secretKey: rabbitmq-password
      remoteRef:
        key: wfp-{{ .Values.externalSecrets.environment }}-rabbitmq-password
    - secretKey: keycloak-admin-password
      remoteRef:
        key: wfp-{{ .Values.externalSecrets.environment }}-keycloak-admin-password
{{- end }}
