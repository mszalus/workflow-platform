plugins {
    id 'wfp.library-conventions'
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-web:3.3.5'
    api 'org.springframework.boot:spring-boot-starter-validation:3.3.5'
    api 'com.fasterxml.jackson.core:jackson-annotations:2.18.1'

    // Needed to compile GcpLoggingJsonProvider; provided at runtime by the service apps
    compileOnly 'net.logstash.logback:logstash-logback-encoder:8.0'
    compileOnly 'ch.qos.logback:logback-classic:1.5.8'
}
