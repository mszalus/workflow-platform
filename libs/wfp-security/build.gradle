plugins {
    id 'wfp.library-conventions'
}

dependencies {
    implementation project(':libs:wfp-common')
    api 'org.springframework.boot:spring-boot-starter-web:3.5.16'
    api 'org.springframework.boot:spring-boot-starter-security:3.5.16'
    api 'org.springframework.boot:spring-boot-starter-oauth2-resource-server:3.5.16'
    api 'org.springframework.boot:spring-boot-starter-data-jpa:3.5.16'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.16'
}
