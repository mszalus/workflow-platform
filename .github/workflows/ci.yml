name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build & Test
        run: ./gradlew build
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/build/reports/tests/'

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: '**/build/reports/jacoco/'

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Unit tests
        id: unit-tests
        run: npm run test:coverage

      - name: Upload test coverage
        if: ${{ !cancelled() && steps.unit-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Audit dependencies
        run: npm audit --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-compose
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Build service images
        run: docker compose -f docker/docker-compose.yml build app

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0

      - name: Scan images for CRITICAL CVEs
        run: |
          IMAGES=(
            docker-app
          )
          failed=()
          for image in "${IMAGES[@]}"; do
            echo "=== Scanning $image ==="
            trivy image --exit-code 1 --severity CRITICAL --no-progress "$image" || failed+=("$image")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "CRITICAL CVEs in: ${failed[*]}"
            exit 1
          fi

  acceptance-tests:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build backend Docker images
        run: docker compose -f docker/docker-compose.yml build app

      - name: Start backend stack and wait until healthy
        run: docker compose -f docker/docker-compose.yml up -d --wait --wait-timeout 600 postgres keycloak app

      - name: Run BDD acceptance tests
        run: ./gradlew :tests:bdd-acceptance:test

      - name: Dump service logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --no-color --timestamps

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bdd-acceptance-report
          path: tests/bdd-acceptance/build/reports/cucumber/

      - name: Stop Docker stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  e2e-playwright:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build images
        run: docker compose -f docker/docker-compose.yml build app admin-portal user-portal

      - name: Start stack and wait until healthy
        run: docker compose -f docker/docker-compose.yml up -d --wait --wait-timeout 600 postgres keycloak app admin-portal user-portal

      - name: Run Playwright E2E tests
        working-directory: e2e
        run: npm test

      - name: Dump service logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --no-color --timestamps

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: e2e/test-results/

      - name: Stop Docker stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint charts
        run: |
          for chart in helm/charts/*/; do
            helm lint "$chart"
          done
