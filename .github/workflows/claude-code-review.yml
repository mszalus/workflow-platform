name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled, unlabeled]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Note when the review starts
        run: echo "REVIEW_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run Claude Code Review
        id: claude-review
        if: ${{ !(github.event.action == 'labeled' && github.event.label.name == 'review-override') }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for real defects. The PR branch is checked out in the working directory.

            1. Read CLAUDE.md. Run `gh pr diff` and `gh pr view`, then read the changed files and the code they call.
            2. Look for bugs: wrong logic or ordering, missed cases, data loss, missing tenant checks (read the Tenancy
               section of CLAUDE.md), missing authorization, and violations of CLAUDE.md. Ignore style, formatting and
               anything the build or tests would already catch.
            3. Report each defect with `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`):
               say what goes wrong and when.
            4. Always finish with one `gh pr comment`. Its first line is the verdict, exactly `Verdict: BLOCK` or
               `Verdict: PASS`. Then summarise the findings, or say "No issues found."
               Use BLOCK only when at least one finding must be fixed before merging: wrong behaviour users would
               hit, data loss, a tenant or authorization leak, or a broken build or deployment. Use PASS when there
               are no findings or only minor ones.

            Only post GitHub comments. Do not put the review in your final message.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Fail on a blocking verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx 'review-override'; then
            echo "The review-override label is set: the review does not block this PR."
            exit 0
          fi
          verdict=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments             --jq '[.comments[] | select(.author.login == "github-actions" and .createdAt >= env.REVIEW_STARTED)] | last | .body // ""'             | grep -m1 '^Verdict: ' || true)
          case "$verdict" in
            "Verdict: PASS"*) echo "The review found nothing blocking." ;;
            "Verdict: BLOCK"*)
              echo "::error::The Claude review found a blocking issue. Fix it, or add the review-override label (docs/engineering-process.md, Claude review verdict)."
              exit 1 ;;
            *)
              echo "::error::The Claude review posted no verdict. Re-run this job."
              exit 1 ;;
          esac
