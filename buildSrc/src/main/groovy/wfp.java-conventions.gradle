plugins {
    id 'java'
    id 'checkstyle'
    id 'jacoco'
    id 'org.owasp.dependencycheck'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-parameters'])
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

checkstyle {
    toolVersion = '10.21.4'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    // Allow Checkstyle to resolve its bundled DTD (needed for configuration_1_3.dtd)
    enableExternalDtdLoad = true
    // Treat all checkstyle warnings as errors once existing suppressions are removed
    maxWarnings = 0
}

// Only lint main sources; test code has different conventions
checkstyleTest.enabled = false

// JaCoCo coverage — generates HTML + XML reports after every test run.
// No thresholds enforced yet; use these to understand coverage trends.
// Reports: build/reports/jacoco/test/html/index.html
jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true   // for CI parsing / coverage badges
        html.required = true  // for local browsing
    }
}

// Auto-generate coverage report whenever tests run
test.finalizedBy jacocoTestReport

// OWASP Dependency-Check — scans for known CVEs in dependencies.
// NOT part of the normal build lifecycle to keep builds fast.
// Run on demand:  ./gradlew dependencyCheckAnalyze
// Or via CI:     .github/workflows/security.yml (scheduled weekly)
dependencyCheck {
    // Fail if any dependency has CVSS score >= 7 (HIGH or CRITICAL)
    failBuildOnCVSS = 7.0f
    // Scan runtime classpath including transitive dependencies
    scanConfigurations = ['runtimeClasspath']
    // HTML for humans, JSON for CI parsing
    formats = ['HTML', 'JSON']
    // NVD API key speeds up initial database downloads significantly.
    // Set NVD_API_KEY env var (free key at https://nvd.nist.gov/developers/request-an-api-key)
    nvd {
        apiKey = System.getenv('NVD_API_KEY') ?: ''
    }
}
