plugins {
    id 'java'
    id 'checkstyle'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-parameters'])
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

checkstyle {
    toolVersion = '10.21.4'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    // Allow Checkstyle to resolve its bundled DTD (needed for configuration_1_3.dtd)
    enableExternalDtdLoad = true
    // Treat all checkstyle warnings as errors once existing suppressions are removed
    maxWarnings = 0
}

// Only lint main sources; test code has different conventions
checkstyleTest.enabled = false
