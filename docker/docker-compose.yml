services:
  postgres:
    image: postgres:16-alpine
    container_name: wfp-postgres
    environment:
      POSTGRES_USER: wfp
      POSTGRES_PASSWORD: wfp_secret
      POSTGRES_DB: wfp
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wfp"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: wfp-rabbitmq
    hostname: wfp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: wfp
      RABBITMQ_DEFAULT_PASS: wfp_secret
    ports:
      - "5672:5672"
      - "15672:15672"
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: wfp-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/wfp
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: wfp
      KC_DB_PASSWORD: wfp_secret
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Observability stack
  # ---------------------------------------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    container_name: wfp-otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC  — services send traces here
      - "4318:4318"   # OTLP HTTP  — services send traces here
      - "8888:8888"   # Collector internal metrics (scraped by Prometheus)
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    container_name: wfp-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"   # Tempo HTTP API — queried by Grafana

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: wfp-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'

  grafana:
    image: grafana/grafana:11.3.2
    container_name: wfp-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_LOG_LEVEL=warn
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - tempo

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------

  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    container_name: wfp-gateway
    ports:
      - "9080:8080"
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/workflow-platform
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/workflow-platform/protocol/openid-connect/certs
      WORKFLOW_SERVICE_URL: http://workflow-service:8081
      CUSTOM_FIELDS_SERVICE_URL: http://custom-fields-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      AUDIT_SERVICE_URL: http://audit-service:8084
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      - keycloak
      - otel-collector

  workflow-service:
    build:
      context: ..
      dockerfile: services/workflow-service/Dockerfile
    container_name: wfp-workflow
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wfp?currentSchema=workflow
      SPRING_DATASOURCE_USERNAME: wfp
      SPRING_DATASOURCE_PASSWORD: wfp_secret
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: wfp
      SPRING_RABBITMQ_PASSWORD: wfp_secret
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/workflow-platform
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/workflow-platform/protocol/openid-connect/certs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      otel-collector:
        condition: service_started

  custom-fields-service:
    build:
      context: ..
      dockerfile: services/custom-fields-service/Dockerfile
    container_name: wfp-custom-fields
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wfp?currentSchema=custom_fields
      SPRING_DATASOURCE_USERNAME: wfp
      SPRING_DATASOURCE_PASSWORD: wfp_secret
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: wfp
      SPRING_RABBITMQ_PASSWORD: wfp_secret
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/workflow-platform
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/workflow-platform/protocol/openid-connect/certs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    container_name: wfp-notification
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wfp?currentSchema=notification
      SPRING_DATASOURCE_USERNAME: wfp
      SPRING_DATASOURCE_PASSWORD: wfp_secret
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: wfp
      SPRING_RABBITMQ_PASSWORD: wfp_secret
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/workflow-platform
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/workflow-platform/protocol/openid-connect/certs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  audit-service:
    build:
      context: ..
      dockerfile: services/audit-service/Dockerfile
    container_name: wfp-audit
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wfp?currentSchema=audit
      SPRING_DATASOURCE_USERNAME: wfp
      SPRING_DATASOURCE_PASSWORD: wfp_secret
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: wfp
      SPRING_RABBITMQ_PASSWORD: wfp_secret
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/workflow-platform
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/workflow-platform/protocol/openid-connect/certs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  admin-portal:
    build:
      context: ..
      dockerfile: frontend/apps/admin-portal/Dockerfile
    container_name: wfp-admin-portal
    ports:
      - "5173:8080"
    depends_on:
      - gateway

  user-portal:
    build:
      context: ..
      dockerfile: frontend/apps/user-portal/Dockerfile
    container_name: wfp-user-portal
    ports:
      - "5174:8080"
    depends_on:
      - gateway

volumes:
  postgres_data:
