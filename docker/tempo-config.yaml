# Grafana Tempo — local development configuration
# Stores traces in a local tmpfs directory; data is lost on container restart.
# For production on GCP, use Cloud Storage as the backend.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 2h

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

query_frontend:
  search:
    duration_slo: 900ms
    throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 450ms
