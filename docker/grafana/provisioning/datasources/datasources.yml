apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: "15s"

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    jsonData:
      # Link traces back to Prometheus for service-graph and span metrics
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      # Derive exemplar links from traceId in Prometheus metrics
      tracesToMetrics:
        datasourceUid: prometheus
