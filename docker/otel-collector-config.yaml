# OpenTelemetry Collector — local development configuration
#
# Receives traces from all backend services via OTLP (gRPC + HTTP) and
# forwards them to Grafana Tempo for local storage and visualisation.
#
# On GCP, replace this collector with the Google Cloud Operations Collector
# or configure the googlecloud exporter in a separate values file:
#
#   exporters:
#     googlecloud:
#       project: ${GOOGLE_CLOUD_PROJECT}
#   service:
#     pipelines:
#       traces:
#         exporters: [googlecloud]

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    limit_mib: 256
    check_interval: 5s

exporters:
  # Forward traces to Grafana Tempo (local)
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Optional: emit a summary of received spans to collector stdout
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
