# Prometheus — local development scrape configuration
#
# Scrapes /actuator/prometheus from every backend service every 15 s.
# On GCP, replace with Google Managed Prometheus (GMP) by adding the
# prometheus.io/scrape: "true" annotations to your Kubernetes pods
# (already configured in the Helm charts) and enabling the GMP operator.

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: local

scrape_configs:
  - job_name: app
    static_configs:
      - targets: ['app:8081']
    metrics_path: /actuator/prometheus

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
