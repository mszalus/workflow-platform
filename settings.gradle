pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'workflow-platform'

// BDD acceptance tests (require live Docker stack on localhost)
include 'tests:bdd-acceptance'

// Backend services
include 'services:app'
