server:
  port: 8081

spring:
  application:
    name: workflow-service
  datasource:
    url: jdbc:postgresql://localhost:5432/wfp?currentSchema=workflow
    username: wfp
    password: wfp_secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: workflow
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    schemas: workflow
    default-schema: workflow
  rabbitmq:
    host: localhost
    port: 5672
    username: wfp
    password: wfp_secret
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/workflow-platform

flowable:
  database-schema-update: true
  async-executor-activate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
