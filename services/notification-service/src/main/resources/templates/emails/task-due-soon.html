<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Task Due Soon</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
<div style="max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px;">
    <h2 style="color: #ffc107;">Task Due Soon</h2>
    <p>The following task is due soon:</p>
    <div style="background: #fff3cd; padding: 15px; border-left: 4px solid #ffc107; margin: 20px 0;">
        <strong th:text="${taskName}">Task Name</strong><br/>
        <small>Due: <span th:text="${dueDate}">date</span></small>
    </div>
    <a th:href="${actionUrl}"
       style="display:inline-block; padding:10px 20px; background:#ffc107; color:#333; text-decoration:none; border-radius:5px;">
        View Task
    </a>
    <p style="color:#888; font-size:12px; margin-top:30px;">This is an automated notification from the Workflow Platform.</p>
</div>
</body>
</html>
