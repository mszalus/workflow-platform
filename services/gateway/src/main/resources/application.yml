server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: workflow-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/workflow/**
            filters:
              - StripPrefix=2
          - id: custom-fields-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/fields/**
            filters:
              - StripPrefix=2
          - id: notification-service
            uri: http://localhost:8083
            predicates:
              - Path=/api/notifications/**
            filters:
              - StripPrefix=2
          - id: audit-service
            uri: http://localhost:8084
            predicates:
              - Path=/api/audit/**
            filters:
              - StripPrefix=2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/workflow-platform
