server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: workflow-service
            uri: ${WORKFLOW_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/workflow/**
            filters:
              - RewritePath=/api/workflow(?:/(?<segment>.*))?$, /api/${segment}
          - id: custom-fields-service
            uri: ${CUSTOM_FIELDS_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/fields/**
            filters:
              - RewritePath=/api/fields(?:/(?<segment>.*))?$, /api/${segment}
          - id: notification-service
            uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/api/notifications/**
          - id: audit-service
            uri: ${AUDIT_SERVICE_URL:http://localhost:8084}
            predicates:
              - Path=/api/audit/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8180/realms/workflow-platform}
