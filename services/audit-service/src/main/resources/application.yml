server:
  port: 8084

spring:
  application:
    name: audit-service
  datasource:
    url: jdbc:postgresql://localhost:5432/wfp?currentSchema=audit
    username: wfp
    password: wfp_secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: audit
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    schemas: audit
    default-schema: audit
  rabbitmq:
    host: localhost
    port: 5672
    username: wfp
    password: wfp_secret
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/workflow-platform
