server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: workflow-engine-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowable}
    username: ${DB_USERNAME:flowable}
    password: ${DB_PASSWORD:flowable}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/workflow}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8080/realms/workflow/protocol/openid-connect/certs}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1

flowable:
  async-executor-activate: true
  history-level: full
  database-schema-update: true
  process:
    servlet:
      path: /flowable-rest
      enabled: false
  idm:
    enabled: false
  app:
    enabled: false

kafka:
  topics:
    workflow-events: workflow.events

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.workflowplatform: INFO
    org.flowable: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
